name: Validate CREST profile

on:
  push:
    paths:
      - "README.md"
      - "assets/**"
      - "scripts/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "README.md"
      - "assets/**"
      - "scripts/**"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate local assets and live markers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")

          references = sorted(set(
              re.findall(r'(?:src|srcset)="(\./assets/[^"]+)"', text)
          ))

          missing = [
              reference for reference in references
              if not Path(reference.removeprefix("./")).is_file()
          ]

          required_markers = [
              "<!-- CREST-LIVE:START -->",
              "<!-- CREST-LIVE:END -->",
          ]
          absent_markers = [marker for marker in required_markers if marker not in text]

          if missing:
              print("Missing README assets:")
              for item in missing:
                  print(f"  - {item}")

          if absent_markers:
              print("Missing live profile markers:")
              for item in absent_markers:
                  print(f"  - {item}")

          if missing or absent_markers:
              sys.exit(1)

          print(f"Validated {len(references)} local assets and all live markers.")
          PY

      - name: Syntax-check updater
        run: python3 -m py_compile scripts/update_profile.py
