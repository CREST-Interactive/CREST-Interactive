<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">CREST INTERACTIVE command interface</title>
  <desc id="desc">Independent full-stack web development by Luno in Switzerland, focused on production websites, commerce, private administration and deployment.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090C11"/>
      <stop offset="1" stop-color="#101722"/>
    </linearGradient>

    <radialGradient id="signal" cx="0.82" cy="0.16" r="0.62">
      <stop offset="0" stop-color="#F1E5C7" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#F1E5C7" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#1B2430" stroke-width="1"/>
    </pattern>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="560" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="560" rx="28" fill="url(#signal)"/>
  <rect width="1600" height="560" rx="28" fill="url(#grid)" opacity="0.62"/>

  <!-- top rail -->
  <rect x="38" y="34" width="1524" height="52" rx="15" fill="#0D131C" stroke="#2D3745" stroke-width="2"/>
  <circle cx="68" cy="60" r="7" fill="#89D185">
    <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="89" y="66" fill="#96A0AE" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15" font-weight="700">
    CREST SYSTEM ONLINE
  </text>
  <text x="1332" y="66" fill="#96A0AE" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15">
    CH / FULL-STACK / 2026
  </text>

  <!-- identity -->
  <g transform="translate(72 128)">
    <rect width="98" height="98" rx="24" fill="#F1E5C7"/>
    <path d="M26 49c0-18 13-31 32-31 12 0 21 4 28 12L72 42c-4-5-8-7-14-7-9 0-16 6-16 14 0 9 7 15 16 15 7 0 12-3 16-8l14 11c-7 9-17 14-31 14-18 0-31-13-31-32z" fill="#15181D"/>
    <path d="M66 20h9l-7 18H58z" fill="#15181D" opacity="0.78"/>
  </g>

  <text x="72" y="292" fill="#F5F7FA" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="72" font-weight="850" letter-spacing="2">
    CREST INTERACTIVE
  </text>
  <text x="76" y="340" fill="#F1E5C7" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="21" font-weight="800" letter-spacing="4">
    BUILDING BEYOND LOCALHOST
  </text>
  <text x="76" y="386" fill="#96A0AE" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="500">
    Independent full-stack web development by Luno.
  </text>

  <!-- command line -->
  <g transform="translate(76 426)">
    <rect width="760" height="76" rx="17" fill="#0D131C" stroke="#2D3745" stroke-width="2"/>
    <text x="26" y="47" fill="#F1E5C7" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="20" font-weight="800">
      crest@studio:~$
    </text>
    <text x="220" y="47" fill="#F5F7FA" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="20">
      ship --identity --systems --production
    </text>
    <rect x="706" y="26" width="13" height="27" rx="2" fill="#F1E5C7">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.15s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- right system monitor -->
  <g transform="translate(1030 126)">
    <rect width="482" height="376" rx="23" fill="#131B27" stroke="#2D3745" stroke-width="2"/>
    <text x="32" y="47" fill="#F1E5C7" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15" font-weight="800" letter-spacing="2">
      ACTIVE CAPABILITIES
    </text>
    <line x1="32" y1="70" x2="450" y2="70" stroke="#2D3745" stroke-width="2"/>

    <g font-family="Inter,Segoe UI,Arial,sans-serif">
      <circle cx="39" cy="112" r="5" fill="#89D185"/>
      <text x="59" y="119" fill="#F5F7FA" font-size="23" font-weight="750">Brand-led websites</text>

      <circle cx="39" cy="163" r="5" fill="#89D185"/>
      <text x="59" y="170" fill="#F5F7FA" font-size="23" font-weight="750">Commerce &amp; booking</text>

      <circle cx="39" cy="214" r="5" fill="#89D185"/>
      <text x="59" y="221" fill="#F5F7FA" font-size="23" font-weight="750">Private admin systems</text>

      <circle cx="39" cy="265" r="5" fill="#89D185"/>
      <text x="59" y="272" fill="#F5F7FA" font-size="23" font-weight="750">Production deployment</text>
    </g>

    <rect x="32" y="310" width="418" height="2" rx="1" fill="#2D3745"/>
    <text x="32" y="347" fill="#96A0AE" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14">
      MODE: PRODUCTION-ORIENTED
    </text>
    <rect x="366" y="330" width="84" height="30" rx="15" fill="#F1E5C7"/>
    <text x="408" y="350" text-anchor="middle" fill="#15181D" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13" font-weight="900">
      SHIPPING
    </text>
  </g>

  <!-- animated signal rail -->
  <rect x="38" y="530" width="1524" height="4" rx="2" fill="#2D3745"/>
  <rect x="38" y="530" width="230" height="4" rx="2" fill="#F1E5C7" filter="url(#softGlow)">
    <animate attributeName="x" values="38;1332;38" dur="7s" repeatCount="indefinite"/>
  </rect>
</svg>
